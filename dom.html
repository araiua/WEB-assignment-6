<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 6 - Part 3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <a href="index.html">Part 1 & 2 (Basics & Effects)</a>
        <a href="dom.html" class="active">Part 3 (DOM & Forms)</a>
        <a href="animation.html">Part 4 (Animations)</a>
        <a href="miniproject.html">Part 5 (Mini Project)</a>
    </nav>

    <div class="container">
        <h1>Part 3. DOM Manipulation with jQuery</h1>

        <section>
            <h2>Task 5. Add & Remove Elements</h2>
            <button id="btn-add-end">Append Item</button>
            <button id="btn-add-start">Prepend Item</button>
            <button id="btn-remove">Remove Last Item</button>
            <ul id="item-list" style="margin: 15px 20px;">
                <li>Item 1</li>
                <li>Item 2</li>
            </ul>
        </section>

        <section>
            <h2>Task 6. Modifying Attributes</h2>
            <img id="attr-img" src="https://via.placeholder.com/150/0000FF/808080?text=Blue" alt="Blue Image"><br>
            <button id="btn-change-img">Change Image Src</button>
            <br><br>
            <a id="attr-link" href="https://google.com" target="_blank">Go to Google</a><br>
            <button id="btn-change-link">Change Link Href</button>
        </section>

        <section>
            <h2>Task 7. Form Interaction</h2>
            <form id="user-form" onsubmit="return false;">
                <label>Name:</label><br>
                <input type="text" id="input-name" placeholder="Enter name"><br>
                <label>Email:</label><br>
                <input type="email" id="input-email" placeholder="Enter email">
            </form>
            <div style="margin-top: 15px; padding: 10px; background: #f8fafc; border-radius: 4px;">
                <p><strong>Live Preview:</strong></p>
                <p>Name: <span id="out-name">---</span></p>
                <p>Email: <span id="out-email">---</span></p>
            </div>
        </section>
    </div>

    <script>
        $(document).ready(function() {
            let itemCounter = 3;

            $("#btn-add-end").click(function() {
                $("#item-list").append("<li>Item " + itemCounter++ + "</li>");
            });
            $("#btn-add-start").click(function() {
                $("#item-list").prepend("<li>Item " + itemCounter++ + "</li>");
            });
            $("#btn-remove").click(function() {
                $("#item-list li:last-child").remove();
            });

            $("#btn-change-img").click(function() {
                $("#attr-img").attr("src", "https://via.placeholder.com/150/FF0000/FFFFFF?text=Red");
            });
            $("#btn-change-link").click(function() {
                $("#attr-link").attr("href", "https://w3schools.com").text("Go to W3Schools");
            });

            $("#input-name").on("input", function() {
                $("#out-name").text($(this).val() || "---");
            });
            $("#input-email").on("input", function() {
                $("#out-email").text($(this).val() || "---");
            });
        });
    </script>
</body>
</html>
